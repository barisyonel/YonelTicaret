name: Vercel Production Deployment

on:
  push:
    branches:
      - update/production-optimizations
      - main
      - production/deploy
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_VERCEL_URL: ${{ secrets.VERCEL_URL }}

